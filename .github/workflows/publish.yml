name: Publish

# Deploys every module to GitHub Packages (ever-ag/sc-common-tiles-request) when trunk
# changes and the pom version hasn't been released yet. To release, bump the version in
# every pom (mvn versions:set -DnewVersion=X.Y.Z -DgenerateBackupPoms=false) in the PR.
# Merges that don't bump it (e.g. Dependabot updates) are skipped.
#
# A version counts as released only once its GitHub release/tag exists. The tag is created
# after every module has been verified on GitHub Packages. If a run fails partway through
# the upload, re-run this workflow: it deploys only the modules that are still missing
# (GitHub Packages does not allow overwriting a version). If a module was left half-uploaded
# (e.g. its jar but not its pom), delete that package version in GitHub, then re-run.
#
# sc-common-tiles depends on this library, so publish a new tiles-request version before
# merging the tiles change that uses it.

on:
  push:
    branches:
      - trunk
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write  # tag + GitHub release
  packages: write  # deploy to GitHub Packages

env:
  MAVEN_USER: ${{ github.actor }}
  MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          server-username: MAVEN_USER
          server-password: MAVEN_TOKEN
          cache: 'maven'

      - name: Read project version
        run: echo "VERSION=$(mvn -B -q -N help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"

      - name: Check whether this version is already released
        id: check
        run: |
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "::notice::$VERSION is a snapshot; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" > /dev/null; then
            echo "::notice::tiles-request $VERSION is already released (tag exists); skipping. Bump the version to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Several older test classes in this fork fail on JDK 17+ (e.g. URLApplicationResourceTest,
      # the portlet module), on trunk as well, so the full suite is not run here. Run the
      # CVE-2023-49735 regression tests explicitly so the locale/path guard is always verified.
      - name: Run locale path-traversal tests
        if: steps.check.outputs.publish == 'true'
        run: >
          mvn -B -pl tiles-request-api,tiles-request-servlet -am test
          -DargLine="--add-opens=java.base/java.lang=ALL-UNNAMED"
          -Dtest=LocaleUtilTest,PostfixedApplicationResourceTest,ServletApplicationContextTest
          -Dsurefire.failIfNoSpecifiedTests=false

      # Build every module before anything is uploaded, so a build failure never leaves a
      # partial release on GitHub Packages. Installing also lets a partial re-deploy below
      # resolve the sibling modules locally.
      - name: Build the whole reactor
        if: steps.check.outputs.publish == 'true'
        run: mvn -B install -DskipTests

      - name: Find modules not yet on GitHub Packages
        if: steps.check.outputs.publish == 'true'
        id: missing
        run: |
          modules=$(bash .github/scripts/unpublished-modules.sh)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

      - name: Deploy the missing modules
        if: steps.check.outputs.publish == 'true' && steps.missing.outputs.modules != ''
        env:
          MODULES: ${{ steps.missing.outputs.modules }}
        run: |
          echo "Deploying: $MODULES"
          mvn -B deploy -DskipTests -DdeployAtEnd=true -pl "$MODULES"

      - name: Verify every module is published
        if: steps.check.outputs.publish == 'true'
        run: |
          remaining=$(bash .github/scripts/unpublished-modules.sh)
          if [[ -n "$remaining" ]]; then
            echo "::error::Still missing on GitHub Packages: $remaining. Re-run this workflow to deploy them."
            exit 1
          fi

      - name: Tag release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
